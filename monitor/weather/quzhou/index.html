<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>衢州天气</title>
<meta name="description" content="衢州实况、24 小时预报、分钟级降水、气象预警，以及 WAQI 空气质量。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/weather.css">
</head>
<body>

<header class="wrap page-head">
  <div>
    <a class="crumb" href="/">← 首页</a>
    <h1>衢州天气</h1>
    <p class="lede">浙江省衢州市 · 和风天气 + WAQI</p>
  </div>
  <div class="head-actions">
    <div class="freshness" id="freshness"><span id="freshness-text">正在载入数据…</span></div>
    <button class="refresh" id="refresh" type="button">刷新</button>
  </div>
</header>

<main class="wrap weather-grid">

  <p class="now-line card-wide" id="now-line">正在载入实况…</p>

  <section class="card card-wide" aria-labelledby="h24">
    <div class="card-head">
      <h2 id="h24">未来 24 小时</h2>
      <span class="hint" id="h24-hint"></span>
    </div>
    <div class="chart-box"><canvas id="chart-24h" role="img" aria-label="未来 24 小时气温与降水趋势"></canvas></div>
    <div class="chips" id="highlights"></div>
  </section>

  <section class="card card-wide" aria-labelledby="hai">
    <div class="card-head">
      <h2 id="hai">空气质量</h2>
      <span class="hint" id="aqi-hint"></span>
    </div>
    <div class="aqi-layout">
      <div class="aqi-main">
        <div class="aqi-summary">
          <div class="aqi-big" id="aqi-big">—</div>
          <div>
            <div class="aqi-cat" id="aqi-cat">数据载入中</div>
            <div class="muted small" id="aqi-primary"></div>
            <div class="muted small" id="aqi-station"></div>
          </div>
        </div>
        <p class="pollutant-caption" id="aqi-pollutant-caption">各污染物分指数</p>
        <div class="pollutants" id="aqi-pollutants"></div>
        <div class="aqi-forecast" id="aqi-forecast" hidden></div>
      </div>
      <div class="aqi-map-wrap">
        <div class="map" id="aqi-map" aria-label="空气质量地图"></div>
        <p class="source">美标 AQI · 分指数与地图瓦片来自 aqicn.org（WAQI）</p>
      </div>
    </div>
  </section>

  <section class="card" aria-labelledby="hmin">
    <div class="card-head">
      <h2 id="hmin">分钟级降水</h2>
      <span class="hint" id="minutely-time"></span>
    </div>
    <p class="minutely-summary" id="minutely-summary">正在载入…</p>
    <div class="chart-box chart-box-sm" id="minutely-chart-wrap" hidden>
      <canvas id="chart-minutely" role="img" aria-label="未来两小时降水强度"></canvas>
    </div>
  </section>

  <section class="card" aria-labelledby="halert">
    <div class="card-head">
      <h2 id="halert">气象预警</h2>
      <span class="hint" id="alert-hint"></span>
    </div>
    <div class="alerts" id="alerts"><p class="empty">正在载入…</p></div>
  </section>

</main>

<footer class="site-footer wrap">
  <span id="footer-updated">数据载入中…</span>
  <span>计划每小时第 7 分钟更新 · <a href="/">返回首页</a></span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js" integrity="sha512-Y51n9mtKTVBh3Jbx5pZSJNDDMyY+yGe77DGtBPzRlgsf/YLCh13kSZ3JmfHGzYFCmOndraf0sQgfM654b7dJ3w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/assets/weather.js"></script>
</body>
</html>
