name: 天气数据

on:
  schedule:
    # 每小时第 7 分钟。GitHub 的定时任务本身会被延迟，
    # 页面会显示真实的数据时间，不再承诺"精确几分更新"。
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 下载仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: monitor/weather/quzhou/requirements.txt

      - name: 安装依赖
        run: pip install -r monitor/weather/quzhou/requirements.txt

      - name: 抓取天气数据
        id: fetch
        continue-on-error: true
        env:
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          QWEATHER_DOMAIN: ${{ secrets.QWEATHER_DOMAIN }}
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
        run: python monitor/weather/quzhou/fetch_data.py --out "$RUNNER_TEMP/weather"

      - name: 发布到 data 分支
        if: always()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/weather"
          if [ ! -f "$OUT/meta.json" ]; then
            echo "没有生成 meta.json，跳过发布"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # data 分支只保留一个提交，每次覆盖，避免仓库历史膨胀
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git checkout -B data FETCH_HEAD
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # 先清空本目录，避免已下线的数据文件残留在 data 分支
          rm -rf weather/quzhou
          mkdir -p weather/quzhou
          cp "$OUT"/*.json weather/quzhou/

          git add -A
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git commit --amend --no-edit --date="$(date -R)"
          else
            git commit -m "气象数据快照 $(date -u +%FT%TZ)"
          fi
          git push --force origin data

      - name: 抓取失败时标记任务失败
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::部分天气接口抓取失败，数据已部分发布，详情见上方日志和 meta.json"
          exit 1
