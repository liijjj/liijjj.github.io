name: 生成首页

on:
  push:
    branches: [main]
    paths:
      - 'sites.json'
      - 'build.py'
      - 'assets/**'
      - 'monitor/**/index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成首页与 404
        run: python build.py

      - name: 提交生成结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html 404.html
          if git diff --cached --quiet; then
            echo "首页没有变化"
            exit 0
          fi

          git commit -m "chore: 更新首页"
          git pull --rebase origin main
          git push
