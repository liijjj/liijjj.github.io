name: 阮一峰博客索引

on:
  schedule:
    # 每周一 03:17（北京时间）
    - cron: '17 19 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 下载仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: monitor/blog/requirements.txt

      - name: 安装依赖
        run: pip install -r monitor/blog/requirements.txt

      - name: 抓取文章索引
        run: python monitor/blog/fetch_posts.py

      - name: 提交索引
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add monitor/blog/posts.json
          if git diff --cached --quiet; then
            echo "索引没有变化"
            exit 0
          fi

          git commit -m "blog: 更新阮一峰博客索引"
          git pull --rebase origin main
          git push
