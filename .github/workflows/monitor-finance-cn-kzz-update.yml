name: 更新可转债
on:
  schedule:
    # 北京时间每天 08:30
    # GitHub 使用 UTC，所以是 00:30
    - cron: '33 23 * * *'
  # 允许手动运行
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-kzz:
    runs-on: ubuntu-latest
    steps:
      - name: 下载仓库
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 AkShare
        run: pip install akshare
      - name: 运行可转债程序
        run: |
          cd monitor/finance/cn/kzz
          python update.py
      - name: 提交网页
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/finance/cn/kzz/index.html
          git diff --cached --quiet || git commit -m "Update KZZ data"
          git push
