name: 更新可转债

on:
  schedule:
    # UTC 01:30 = 北京时间 09:30
    - cron: '30 1 * * *'

  # 允许 GitHub 页面手动执行
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 下载仓库
      # ------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ------------------------------------------------------
      # 安装 AkShare
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare


      # ------------------------------------------------------
      # 更新数据
      # ------------------------------------------------------

      - name: Update KZZ
        run: |
          python update.py


      # ------------------------------------------------------
      # 提交 index.html
      # ------------------------------------------------------

      - name: Commit
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          git diff --cached --quiet || \
            git commit -m "Update KZZ data"

          git push
