name: 生成网站首页

on:
  workflow_dispatch:

  # 仓库有文件变化时自动运行
  push:
    paths:
      - '**/*.html'
      - '**/*.htm'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: 下载仓库
        uses: actions/checkout@v4

      - name: 生成首页
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape

          root = Path('.')

          files = []

          for p in root.rglob('*'):

              if not p.is_file():
                  continue

              # 排除 GitHub 内部文件
              if '.git' in p.parts or '.github' in p.parts:
                  continue

              # 排除根目录自己的 index.html
              if p == root / 'index.html':
                  continue

              # 只要 html / htm
              if p.suffix.lower() in ('.html', '.htm'):
                  files.append(p.as_posix())

          files.sort()

          links = '\n'.join(
              f'<li><a href="/{escape(x)}">/{escape(x)}</a></li>'
              for x in files
          )

          html = f'''<!DOCTYPE html>
          <html lang="zh-CN">

          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">

          <title>Liijjj</title>

          <style>
          body {{
              margin: 30px;
              font-family:
                  Arial,
                  "Microsoft YaHei",
                  sans-serif;
          }}

          h1 {{
              margin-bottom: 20px;
          }}

          li {{
              margin: 10px 0;
          }}

          a {{
              text-decoration: none;
          }}
          </style>

          </head>

          <body>

          <h1>我的项目</h1>

          <ul>
          {links}
          </ul>

          </body>

          </html>
          '''

          (root / 'index.html').write_text(
              html,
              encoding='utf-8'
          )

          print(f'发现 {len(files)} 个网页')
          PY

      - name: 提交首页
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          git diff --cached --quiet || git commit -m "Update homepage"

          git push
